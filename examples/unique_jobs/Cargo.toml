[package]
name = "unique_jobs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
underway = { path = "../../" }
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1.0.210", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
jiff = { version = "0.1.13", features = ["serde"] }
