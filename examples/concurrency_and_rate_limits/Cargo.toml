[package]
name = "concurrency_and_rate_limits"
version = "0.1.0"
edition = "2021"

[dependencies]
underway = { path = "../../" }
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tokio = { version = "1.40.0", features = ["full"] }
serde = { version = "1.0.210", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
